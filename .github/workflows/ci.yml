name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      # build re-runs validate (without the production guard) and generates dist/.
      - run: npm run build
      # Performance budget per page (scripts/check-size.ts).
      - run: npm run size

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Visual baselines are per platform. If a Linux baseline is missing (new screen or
      # deliberate change), write it here and upload it so it can be reviewed and committed.
      # Existing baselines are never overwritten: a visual change still fails the next step.
      - name: Write missing Linux visual baselines
        run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots=missing --reporter=dot
      - name: Upload new Linux baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/e2e/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: ignore
          retention-days: 7

      # Playwright builds the site and serves it with `astro preview` (playwright.config.ts).
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
